spring.application.name=Haru_Coding_backend

spring.datasource.url=${Haru_Coding_backend_DATASOURCE_URL}
spring.datasource.username=${Haru_Coding_backend_DATASOURCE_USERNAME}
spring.datasource.password=${Haru_Coding_backend_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# create면 재시작마다 테이블/데이터가 날아감 → 생성 문제·시드 영속화 위해 update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Google Client
spring.security.oauth2.client.registration.google.client-id=${Haru_Coding_backend_CLIENT_ID}

jwt.secret=haruCoding-secret-key-be-senior-2026-spring-boot
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=604800000

# ── OpenAI (생성/임베딩) ──────────────────────────────
# 코드가 ${openai.api.key}를 참조하므로 여기서 .env의 OPENAI_API_KEY를 끌어와 배선
openai.api.key=${OPENAI_API_KEY:}
openai.generation.model=${OPENAI_GENERATION_MODEL:gpt-5.4-mini}

# ── Encryption (AesGcmEncryptor가 참조, 32바이트 base64 필수) ──
encryption.secret-key=${ENCRYPTION_SECRET_KEY:}

# ── 시드 적재 ────────────────────────────────────────
# all_seeds.json → seed_sets 자동 적재 (이미 있으면 스킵). 끄려면 false
seed.autoload=true
seed.retrieve.topk=3