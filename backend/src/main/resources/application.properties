spring.application.name=Haru_Coding_backend

# 공통 설정. 운영 전용 설정은 application-prod.properties(SPRING_PROFILES_ACTIVE=prod), 비밀값은 환경변수로 주입한다.

# DB 접속 정보. docker compose(로컬 backend/docker-compose.yml, 서버 deploy/docker-compose.yml)는
# 표준 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 환경변수로 아래 값을 덮어쓴다.
# IDE에서 직접 실행할 때만 아래 이름을 쓴다. 표준 이름(DB_*)을 먼저 읽고, 없으면 예전 이름(Haru_Coding_backend_*)을 읽는다.
spring.datasource.url=${DB_URL:${Haru_Coding_backend_DATASOURCE_URL:}}
spring.datasource.username=${DB_USERNAME:${Haru_Coding_backend_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${Haru_Coding_backend_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# create면 재시작마다 테이블/데이터가 날아감 → 생성 문제·시드 영속화 위해 update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 구글 로그인 토큰의 발급 대상(aud)으로 허용할 클라이언트 ID. 쉼표로 여러 개 지정 가능.
# 비어 있으면 구글 로그인을 거부한다(GoogleTokenVerifier).
# 서버 compose는 GOOGLE_CLIENT_ID 값을 예전 이름(Haru_Coding_backend_CLIENT_ID)으로 넘기므로 두 이름을 모두 읽는다.
google.client-ids=${GOOGLE_CLIENT_ID:${Haru_Coding_backend_CLIENT_ID:}}

# 서명 키는 공개 저장소에 두지 않는다. backend/.env 또는 배포 환경변수의 JWT_SECRET로 주입 (32바이트 이상, 생성: openssl rand -base64 48).
# 비어 있으면 JwtProvider가 안내 메시지와 함께 기동을 멈춘다.
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=604800000

# ── OpenAI (생성/임베딩) ──────────────────────────────
# 코드가 ${openai.api.key}를 참조하므로 여기서 .env의 OPENAI_API_KEY를 끌어와 배선
openai.api.key=${OPENAI_API_KEY:}
openai.generation.model=${OPENAI_GENERATION_MODEL:gpt-5.4-mini}

# ── 외부 호출 시간 제한 (OpenAI·구글) ─────────────────
# 배포 서버 앞단 Cloudflare는 100초 안에 응답이 없으면 앱에 524 오류를 돌려준다.
# 그래서 OpenAI 응답은 60초까지 기다리고, 문제 생성 재시도는 시작 후 30초 안에서만 한다(최악 약 90초 + 코드 검증 시간).
http.client.connect-timeout=5s
http.client.read-timeout=60s
generation.retry-window=30s

# ── Encryption (AesGcmEncryptor가 참조, 32바이트 base64 필수) ──
encryption.secret-key=${ENCRYPTION_SECRET_KEY:}

# ── 시드 적재 ────────────────────────────────────────
# all_seeds.json → seed_sets 자동 적재 (이미 있으면 스킵). 끄려면 SEED_AUTOLOAD=false
seed.autoload=${SEED_AUTOLOAD:true}
seed.retrieve.topk=3

# ── 비용 보호 ─────────────────────────────────────────
# 관리용 API(/api/problems/generate, 임베딩 일괄 생성)는 X-Admin-Key 헤더가 이 값과 같을 때만 허용. 비우면 항상 거부
admin.api-key=${ADMIN_API_KEY:}
# 사용자 1명이 하루에 AI로 새로 만들 수 있는 문제 수 (한국 시간 자정 초기화)
generation.daily-limit-per-user=${GENERATION_DAILY_LIMIT:30}
