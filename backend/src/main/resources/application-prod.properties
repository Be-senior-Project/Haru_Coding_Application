# 운영(prod) 프로필 전용 설정. 사용: SPRING_PROFILES_ACTIVE=prod
# 공통 설정은 application.properties에 있고, 비밀값(DB_*, JWT_SECRET, OPENAI_API_KEY,
# ENCRYPTION_SECRET_KEY, GOOGLE_CLIENT_ID, ADMIN_API_KEY)은 배포 환경변수로 주입한다.

# SQL 로그에는 사용자 데이터가 섞여 나오고 로그 양도 많아 운영에서는 끈다
spring.jpa.show-sql=false

# DB 구조는 배포 시 init.sql을 1회 실행해 만들고(확장·인덱스·제약 포함),
# 이후 엔티티에 추가된 컬럼만 Hibernate가 보완한다. validate는 init.sql에 없는 컬럼이 생기면 기동이 멈춘다.
spring.jpa.hibernate.ddl-auto=update
