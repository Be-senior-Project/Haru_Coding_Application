plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.be_senior'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Validation (@Valid, @NotBlank 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JSONB 타입 지원 (hypersistence-utils)
	implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.7.3'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// LangChain4j, openAI, vectorDB 의존성
//	implementation 'dev.langchain4j:langchain4j-spring-boot-starter:1.0.1'
//	implementation 'dev.langchain4j:langchain4j-open-ai:1.0.1'
//	implementation 'dev.langchain4j:langchain4j-pgvector:1.0.1'
	implementation 'dev.langchain4j:langchain4j-spring-boot-starter:0.36.2'
	implementation 'dev.langchain4j:langchain4j-open-ai:0.36.2'
	implementation 'dev.langchain4j:langchain4j-pgvector:0.36.2'
}

tasks.named('test') {
	useJUnitPlatform()
}