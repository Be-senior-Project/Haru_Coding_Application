version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harucoding-db
    environment:
      POSTGRES_DB: HaruCoding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root1212
    ports:
      - "5432:5432"
    volumes:
      - harucoding_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d HaruCoding"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  harucoding_data: